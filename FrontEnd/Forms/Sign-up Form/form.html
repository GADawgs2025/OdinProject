<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>SignUp Form</title>
        <!--JavaScript (Don't forget 'defer')-->
        <script src="script.js" defer></script>
        <!--CSS-->
        <link rel ="stylesheet" href="styles.css">
    </head>
    <body>
        <div class ="left-container">
        
            <img src="Odin-Project-Image.jpg" class="leaf-image">
            <div class="image-title">
                <img src="odin-lined.png" class="odin-image">
                <p>ODIN</p>
            </div>
        </div>
        <div class="right-container">
            <div class="right-text">
                <h2 class="right-text-info">Hello there! This is not a real online service, but I've created this website to 
                    improve on my skill and I trust in the Lord that He will provide. May I not fear man and become the best 
                    developer God has given me the ability to be.
                </h2>
            </div>
            <div class="right-form">
                <form class ="flex-form" action="" method="post">
                    <h2 class ="form-title">Let's do this!</h2> 

                    <div class="form-box">
                    <label for ="first-name">FIRST NAME</label>
                    <input type="text" id="first-name" name="first-name"/>
                    </div>
                    <div class="form-box">
                    <label for ="last-name">LAST NAME</label>
                    <input type="text" id="last-name" name="last-name"/>
                    </div>  

                    <div class="form-box">
                    <label for="email">EMAIL</label>
                    <input type="email" id="email" name="email"/>
                    </div>
                    <div class="form-box">
                    <label for="phone-number">PHONE NUMBER</label>
                    <input type="text" id="phone-number" name="phone-number"/>
                    </div>    

                    <div class="form-box">
                    <label for="password">PASSWORD</label>
                    <input type="password" id="password" name="password"/>
                    </div>
                    <div class="form-box">
                    <label for="confirm-password">CONFIRM PASSWORD</label>
                    <input type="password" id="confirm-password" name="confirm-password"/>
                    </div>                    

                </form>
            </div>
            <div class="right-button">
                <button type="submit" class="create-account">Create Account</button>
            </div>
        </div>
    </body>
</html>
